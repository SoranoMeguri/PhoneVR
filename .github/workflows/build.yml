name: Android CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Rust packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Android SDK and NDK
        run: |
          SDK_ROOT=${{ github.workspace }}/android_sdk
          mkdir -p $SDK_ROOT
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

          # Download and unzip command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q -o cmdline-tools.zip -d $SDK_ROOT/cmdline-tools-tmp
          rm cmdline-tools.zip

          # Move to the final 'latest' directory structure
          mkdir -p $SDK_ROOT/cmdline-tools/latest
          mv $SDK_ROOT/cmdline-tools-tmp/cmdline-tools/* $SDK_ROOT/cmdline-tools/latest/
          rm -rf $SDK_ROOT/cmdline-tools-tmp

          # Define sdkmanager path
          SDK_MANAGER=$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager

          # Add to PATH (for subsequent steps if any)
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

          # Accept licenses and install packages using full path
          yes | $SDK_MANAGER --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          $SDK_MANAGER --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653"

      - name: Prepare Dependencies and Build Project
        run: |
          cd code/mobile/android/PhoneVR

          echo "sdk.dir=${{ env.ANDROID_SDK_ROOT }}" > local.properties

          sed -i '/unzip download.zip/a cp local.properties "cardboard-master/"' ./prepare-alvr-deps.sh

          chmod +x ./prepare-alvr-deps.sh
          ./prepare-alvr-deps.sh

          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonevr-debug-apks
          path: code/mobile/android/PhoneVR/app/build/outputs/apk/**/*.apk
